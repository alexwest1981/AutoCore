# Where the program keeps its SQLite file. Not a secret, but it differs between machines, so it
# is a setting: -Dautocore.db.path=/tmp/kopia.db or AUTOCORE_DB_PATH=/tmp/kopia.db.
autocore.db.path=${AUTOCORE_DB_PATH:data/autocore.db}

# The demo accounts' passwords, when they are handed out of band instead of taken from migration
# 004. Empty means "keep what the migration wrote", which is how the app runs in a classroom.
# A value here is hashed at start with a fresh salt and never logged, never stored as clear text.
# The hash the table keeps is not a secret: it cannot be turned back into the password.
autocore.password.admin=${AUTOCORE_ADMIN_PASSWORD:}
autocore.password.staff=${AUTOCORE_STAFF_PASSWORD:}
autocore.password.readonly=${AUTOCORE_READONLY_PASSWORD:}
