# Funktionsväxlar för utveckling. Här kan en funktion slås av och på utan att koden rörs:
# true = på, allt annat (och saknad nyckel) = av.
#
# En enskild körning kan överrida en växel utan att filen ändras:
#   java -Dautocore.features.globalSearch=false ... (samma sak i .vscode/launch.json)
#
# globalSearch: sökfältet till höger i sidhuvudet, i samma rad som sidtiteln, med den granulära
# dropdownen under sig (SearchDropdown, GlobalSearch, SearchResultsView). Funktionen togs bort
# tillsammans med toppmenyn och ligger nu bakom den här växeln i stället för att vara
# bortkommenterad.
globalSearch=true
