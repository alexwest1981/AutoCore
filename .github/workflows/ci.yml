name: AutoCore CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  verify:
    name: Build, Test & Quality Audits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify test.ps1 is saved as UTF-8 with BOM (Windows PowerShell 5.1)
        run: |
          if [ "$(head -c 3 test.ps1 | od -An -tx1 | tr -d ' \n')" != "efbbbf" ]; then
            echo "::error file=test.ps1::test.ps1 saknar UTF-8 BOM. Windows PowerShell 5.1 läser då filen som Cp1252 och skriptet kraschar. Spara filen som 'UTF-8 with BOM' (se .editorconfig)."
            exit 1
          fi
          echo "test.ps1 har UTF-8 BOM."

      - name: Setup Java 8 with JavaFX (BellSoft Liberica JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'liberica'
          java-version: '8'
          java-package: 'jdk+fx'

      - name: Set executable permissions
        run: chmod +x test.sh start.sh dataflow.sh

      - name: Verify quality, security and WCAG audits
        run: xvfb-run --auto-servernum ./test.sh --audit

      - name: Run the app's own tests
        run: xvfb-run --auto-servernum ./test.sh

      - name: Run the data flow analysis (AK-15)
        run: xvfb-run --auto-servernum ./dataflow.sh
