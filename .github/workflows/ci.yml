name: AutoCore CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  verify:
    name: Build, Test & Quality Audits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 8 with JavaFX (BellSoft Liberica JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'liberica'
          java-version: '8'
          java-package: 'jdk+fx'

      - name: Set executable permissions
        run: chmod +x test.sh start.sh

      - name: Verify quality, security and WCAG audits
        run: xvfb-run --auto-servernum ./test.sh --audit

      - name: Run the app's own tests
        run: xvfb-run --auto-servernum ./test.sh
