name: AutoCore CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

# **Ett flöde per gren.** Utan det startar varje push en egen körning; på en sprintgren med
# öppen PR blir det två samtidigt (push + pull_request) som slåss om samma runners. Den äldre
# avbryts i stället — den senaste är den som gäller.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build
    runs-on: ubuntu-latest
    # En hängande Maven-körning ska inte kunna stå i timmar: standardtaket är sex timmar.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B -f WigellAutoCore/autocore/pom.xml package
