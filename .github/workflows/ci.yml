name: AutoCore CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  verify:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 8 with JavaFX (BellSoft Liberica JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'liberica'
          java-version: '8'
          java-package: 'jdk+fx'

      - name: Compile the application
        run: |
          mkdir -p out/ci
          find WigellAutoCore/autocore/src -name '*.java' > out/ci/sources.txt
          javac -d out/ci \
            -sourcepath WigellAutoCore/autocore/src \
            -cp WigellAutoCore/autocore/lib/sqlite-jdbc-3.53.4.0.jar:WigellAutoCore/autocore/lib/json-20231013.jar \
            @out/ci/sources.txt
